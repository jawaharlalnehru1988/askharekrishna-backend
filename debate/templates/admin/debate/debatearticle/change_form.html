{% extends "admin/change_form.html" %}
{% load i18n %}

{% block submit_buttons_bottom %}
  {{ block.super }}
  {% if original.pk and available_languages %}
  <div class="submit-row" style="margin-top:8px;">
    <h3 style="margin-bottom: 8px;">Add / Regenerate MCQs via OpenAI</h3>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      {% for lang in available_languages %}
        <a href="{% url 'admin:debate_debatearticle_generate_mcqs' original.pk lang %}"
           class="button"
           style="background:#417690;color:#fff;padding:8px 16px;border-radius:4px;text-decoration:none;font-size:13px;"
           onclick="return confirm('This will REPLACE all existing MCQs for {{ lang|upper }}. Continue?');">
          &#129302; Generate MCQs ({{ lang|upper }})
        </a>
      {% endfor %}
    </div>
  </div>
  {% endif %}
{% endblock %}
